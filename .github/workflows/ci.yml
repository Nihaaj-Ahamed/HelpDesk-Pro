name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  browser:
    runs-on: ubuntu-latest
    env:
      DATABASE_PASSWORD: ci-only-database-password
      JWT_SECRET: ci-only-signing-secret-with-at-least-32-bytes
      FRONTEND_ORIGIN: http://localhost:3000
      APP_AUTH_RATE_LIMIT: '1000'
      PLAYWRIGHT_CHANNEL: chromium
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: docker compose up -d postgres mailpit
      - run: mvn -B -DskipTests package
        working-directory: backend
      - name: Start API and wait for readiness
        run: |
          java -jar backend/target/helpdesk-api-0.1.0.jar > api.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://localhost:8080/v3/api-docs > /dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/v3/api-docs > /dev/null
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose down
