spring:
  task:
    scheduling:
      pool:
        size: 4
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.localhost: ${MAIL_HELO_NAME:localhost}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${DATABASE_USER:helpdesk}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true
server:
  error:
    include-message: never
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
    org.springframework.mail: WARN
    org.eclipse.angus.mail: WARN
  structured:
    format:
      console: ecs
app:
  mail-from: ${MAIL_FROM:helpdesk@local.test}
  invitation-limit-per-hour: ${INVITATION_LIMIT_PER_HOUR:30}
  jwt-secret: ${JWT_SECRET}
  origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  secure-cookie: ${SECURE_COOKIE:false}
